services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumora_backend
    restart: always
    ports:
      - "7319:7319"
    env_file:
      - .env
    environment:
      # Run the container with production Django settings so WhiteNoise and
      # the collected staticfiles manifest are used by Gunicorn.
      - DJANGO_SETTINGS_MODULE=lumora.settings.production
      - ENVIRONMENT=production
      - DJANGO_DEBUG=false
    volumes:
      # Host Nginx serves these same directories directly.
      - /opt/shared/lumora-treks-BE/staticfiles:/app/staticfiles
      - /opt/shared/lumora-treks-BE/media:/app/media
