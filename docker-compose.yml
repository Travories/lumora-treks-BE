services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumora_backend
    restart: always
    ports:
      - "7319:7319"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - staticfiles_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: lumora_redis
    restart: always
    ports:
      - "8385:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel notice

volumes:
  redis_data:
  staticfiles_data:
  media_data:
