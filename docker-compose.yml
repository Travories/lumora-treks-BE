services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumora_backend
    restart: always
    ports:
      - "7319:7319"
    env_file:
      - .env
    environment:
      # Run the container with production Django settings so WhiteNoise and
      # the collected staticfiles manifest are used by Gunicorn.
      - DJANGO_SETTINGS_MODULE=lumora.settings.production
      - ENVIRONMENT=production
      - DJANGO_DEBUG=false
      # The cache is this project's own Redis (below), reached by service name.
      - ENABLE_REDIS=true
      - REDIS_URL=redis://redis:6379/1
    volumes:
      # Host Nginx serves these same directories directly (nginx.conf).
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: lumora_redis
    restart: always
    # Cache only: no host port, nothing outside this project reaches it.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
