# ==============================================================================
# Nginx Configuration for Backend (apilumora.rivetsoft.com)
# File: /etc/nginx/sites-available/apilumora.rivetsoft.com
# Managed with Certbot SSL and proxy fallback to WhiteNoise for static files
# ==============================================================================

server {
    server_name apilumora.rivetsoft.com;

    client_max_body_size 100M;

    # Static & Media handling (serves from host disk, with proxy fallback to WhiteNoise if missing)
    location /static/ {
        alias /var/www/lumora-treks-BE/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri @proxy_to_app;
    }

    location /media/ {
        alias /var/www/lumora-treks-BE/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy to Django Gunicorn running on port 7319
    location / {
        proxy_pass http://127.0.0.1:7319;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location @proxy_to_app {
        proxy_pass http://127.0.0.1:7319;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/apilumora.rivetsoft.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/apilumora.rivetsoft.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = apilumora.rivetsoft.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name apilumora.rivetsoft.com;
    return 404; # managed by Certbot
}
