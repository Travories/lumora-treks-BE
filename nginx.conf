# ==============================================================================
# Nginx Configuration for Backend (apilumora.rivetsoft.com)
# File: /etc/nginx/sites-available/apilumora.rivetsoft.com
# Proxies all requests (including /static/) to Gunicorn / WhiteNoise
# ==============================================================================

server {
    server_name apilumora.rivetsoft.com;

    client_max_body_size 100M;

    # Media files (uploaded user assets)
    location /media/ {
        alias /var/www/lumora-treks-BE/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy EVERYTHING (including /static/) directly to Django Gunicorn / WhiteNoise
    location / {
        proxy_pass http://127.0.0.1:7319;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/apilumora.rivetsoft.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/apilumora.rivetsoft.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = apilumora.rivetsoft.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name apilumora.rivetsoft.com;
    return 404; # managed by Certbot
}
