# ==============================================================================
# Nginx Configuration for Backend (apilumora.rivetsoft.com)
# File: /etc/nginx/sites-available/apilumora.rivetsoft.com
# Proxies to Django Gunicorn on port 7319
# ==============================================================================

server {
    listen 80;
    server_name apilumora.rivetsoft.com;

    client_max_body_size 100M;

    # Static files handling (after running python manage.py collectstatic)
    location /static/ {
        alias /var/www/lumora-treks-BE/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media files handling
    location /media/ {
        alias /var/www/lumora-treks-BE/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy requests to Gunicorn running on port 7319
    location / {
        proxy_pass http://127.0.0.1:7319;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

